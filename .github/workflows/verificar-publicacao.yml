name: Verificar publicacao Render - calculadora
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: read
jobs:
  publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obter fontes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Conferir versao publica contra package.json
        run: node scripts/verificar-publicacao.mjs
