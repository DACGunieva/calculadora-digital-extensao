name: Verificar publicacao Render - calculadora
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: read
jobs:
  publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Obter fontes
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir versao publica contra package.json
        run: node scripts/verificar-publicacao.mjs
